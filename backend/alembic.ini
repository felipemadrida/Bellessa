# Configuración de Alembic para Bellessa.
# La URL real se toma de `app.config.settings` (env BELLESSA_DATABASE_URL), por lo
# que el valor de abajo es solo un placeholder que `env.py` sobreescribe.

[alembic]
script_location = alembic
prepend_sys_path = .
# El valor real se inyecta en env.py desde settings.database_url.
sqlalchemy.url = sqlite:///./bellessa.db

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
